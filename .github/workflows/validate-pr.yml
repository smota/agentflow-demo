name: Validate PR
on:
  pull_request:
    branches: [development, main]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  validate-pr-body:
    name: Validate PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smota/agentflow-sdlc
          ref: 3095083f9e371af4643c9590c9e965b1e232bf67
          path: .tooling/agentflow-next
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir .tooling/agentflow-next install --frozen-lockfile --ignore-scripts
      - name: Check current PR manifest contract
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p .agent-runs/ci
          printf '%s' "$PR_BODY" > .agent-runs/ci/pr-body.md
          node .tooling/agentflow-next/scripts/validate-pr-manifest.mjs --path .agent-runs/ci/pr-body.md
      - name: Check session-record ledger contract
        run: |
          node scripts/validate-session-record.mjs --glob "data/sessions/*.json" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-body .agent-runs/ci/pr-body.md
