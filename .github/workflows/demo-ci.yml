name: Demo CI
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  workflow:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check:workflow
