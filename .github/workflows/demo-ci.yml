name: Demo CI
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
permissions:
  contents: read
jobs:
  workflow:
    name: Workflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smota/agentflow-sdlc
          ref: 3095083f9e371af4643c9590c9e965b1e232bf67
          path: .tooling/agentflow-next
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir .tooling/agentflow-next install --frozen-lockfile --ignore-scripts
      - run: npm run check:workflow
  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --basetemp=.cache/pytest
      - run: python -m tools.crawl validate
      - run: python -m tools.lists validate
